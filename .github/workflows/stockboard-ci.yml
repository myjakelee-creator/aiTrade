name: StockBoard CI

on:
  pull_request:
    branches:
      - main
      - hot-priority-integrated-20260630
      - fix/restore-stable-collector-20260713
      - fix/restore-live-metrics-rest-20260715
      - fix/stockboard-display-continuity-20260721
      - "stable/**"
  push:
    branches:
      - main
      - hot-priority-integrated-20260630
      - "fix/**"
      - "feature/**"
      - "hotfix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    name: Windows Python regression
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Show Python environment
        shell: pwsh
        run: |
          python --version
          python -c "import struct; print('python_bits=', struct.calcsize('P') * 8)"

      - name: Install CI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest websockets websocket-client

      - name: Verify Windows PowerShell dependency auto-recovery
        shell: pwsh
        run: |
          $python64 = (Get-Command python).Source
          python -m pip uninstall -y websockets
          $env:STOCKBOARD_PYTHON64 = $python64
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\stockboard_v2_python64_dependencies.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "dependency bootstrap failed with exit code $LASTEXITCODE"
          }
          python -c "from websockets.sync.client import connect; print('dependency_bootstrap_verified')"

      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m py_compile `
            scripts\stockboard_v2_price_compare.py `
            scripts\stockboard_v2_price_trace.py `
            scripts\stockboard_v2_price_trace_browser.py `
            scripts\stockboard_v2_collector_trace.py `
            scripts\stockboard_v2_collector_trace_policy_fix.py `
            scripts\stockboard_v2_price_history_backtrace.py `
            realtime_v2\premarket_rollover_priority_patch.py `
            realtime_v2\price_time_monotonic_patch.py `
            realtime_v2\sse_latest_only_patch.py `
            realtime_v2\worker_trade_field_regression_guard.py `
            realtime_v2\worker_board_display_continuity_patch.py `
            realtime_v2\worker_board_display_continuity_runtime_opt.py `
            realtime_v2\worker64_guarded_large_bidask.py `
            realtime_v2\html_build_identity_patch.py `
            realtime_v2\public_gateway.py

      - name: Check doctor and launcher syntax
        shell: pwsh
        run: |
          $doctor = Get-Content -LiteralPath .\scripts\stockboard_execution_strength_doctor.ps1 -Raw
          [void][scriptblock]::Create($doctor)
          $context = Get-Content -LiteralPath .\scripts\start_context_singleflight.ps1 -Raw
          [void][scriptblock]::Create($context)
          $safe = Get-Content -LiteralPath .\scripts\stockboard_v2_large_safe.ps1 -Raw
          [void][scriptblock]::Create($safe)
          $consistency = Get-Content -LiteralPath .\scripts\stockboard_v2_data_consistency.ps1 -Raw
          [void][scriptblock]::Create($consistency)
          python .\scripts\stockboard_v2_price_compare.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "price doctor import/help failed" }
          python .\scripts\stockboard_v2_price_trace.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "price trace import/help failed" }
          python .\scripts\stockboard_v2_price_trace_browser.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "browser price trace import/help failed" }
          python .\scripts\stockboard_v2_collector_trace_policy_fix.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "collector trace policy import/help failed" }
          python .\scripts\stockboard_v2_price_history_backtrace.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "price history backtrace import/help failed" }
          cmd.exe /d /c "call stockboard_v2_large.cmd __syntax_probe__ >nul 2>&1"
          $batchRc = $LASTEXITCODE
          if ($batchRc -eq 255) { throw "batch parser failed" }
          $global:LASTEXITCODE = 0
          Write-Host "doctor_context_launcher_price_collector_history_trace_verified"

      - name: Run StockBoard targeted tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          python -m pytest -q `
            tests\test_html_build_identity.py `
            tests\test_premarket_rollover_priority_patch.py `
            tests\test_price_time_monotonic_patch.py `
            tests\test_sse_latest_only_patch.py `
            tests\test_worker_trade_field_regression_guard.py `
            tests\test_trade_value_date_rollover_reproduction.py `
            tests\test_stockboard_v2_price_compare.py `
            tests\test_stockboard_v2_price_trace.py `
            tests\test_stockboard_v2_price_trace_browser.py `
            tests\test_stockboard_v2_collector_trace.py `
            tests\test_stockboard_v2_collector_trace_policy_fix.py `
            tests\test_stockboard_v2_price_history_backtrace.py `
            tests\test_html_last_trade_age_semantics.py `
            tests\test_context_market_supply_trading_date.py `
            tests\test_context_snapshot_writer_portable.py `
            tests\test_context_snapshot_writer_portable_v2.py `
            tests\test_context_snapshot_retry_patch.py `
            tests\test_context_single_owner_launcher.py `
            tests\test_execution_strength_source_separation.py `
            tests\test_worker_execution_strength_diagnostics.py `
            tests\test_momentum_badge_engine.py `
            tests\test_worker_momentum_badge_policy.py `
            tests\test_worker_momentum_accuracy_patch.py `
            tests\test_worker_board_trading_date_guard.py `
            tests\test_worker_board_display_continuity_safety.py `
            tests\test_worker_board_display_continuity_runtime_opt.py `
            tests\test_worker_aux_metric_source_contract.py `
            tests\test_worker_portable_cache_sync.py `
            tests\test_worker_portable_rebuild_status.py `
            tests\test_worker_market_metric_session_manager.py `
            tests\test_worker_market_supply_hold.py `
            tests\test_worker_market_supply_hold_runtime_fix.py `
            tests\test_worker_metric_state_overlay.py `
            tests\test_worker_five_metric_display_policy.py `
            tests\test_worker_aux_metric_runtime_policy.py `
            tests\test_worker_approved_minute_pipeline.py `
            tests\test_worker_minute_value_hold_zero_cleanup.py `
            tests\test_worker_approved_minute_pipeline_safety.py `
            tests\test_worker_approved_minute_rollover_guard.py `
            tests\test_worker_momentum_1m.py `
            tests\test_momentum_rollover_integration.py `
            tests\test_html_momentum_full_chain.py `
            tests\test_html_mobile_view.py `
            tests\test_html_mobile_top_status.py `
            tests\test_html_portable_rebuild_status.py `
            tests\test_html_horizontal_daily_candle.py `
            tests\test_worker_metric_session_alignment.py `
            tests\test_worker_rest_live_metrics_aftermarket.py `
            tests\test_worker_six_metric_lifecycle.py `
            tests\test_worker_six_metric_runtime_guards.py `
            tests\test_worker_large_trade_stage4.py `
            tests\test_html_metric_display_patches.py `
            tests\test_worker_realtime_strength_ws.py `
            tests\test_worker_rest_live_metrics_patch.py `
            tests\test_tr_singleflight.py `
            tests\test_stockboard_public_gateway.py `
            --junitxml=test-results\pytest.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockboard-pytest-results
          path: test-results
          retention-days: 14
          if-no-files-found: warn
