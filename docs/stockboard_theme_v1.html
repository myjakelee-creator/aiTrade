<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThemeBoard v1 · 테마 돈쏠림 / 주도주</title>
<style>
:root{--red:#d71920;--blue:#1266d6;--green:#067a2a;--text:#111827;--muted:#64748b;--grid:#c7d1dc;--head:#eaf0f6;--bg:#f6f8fb;--selected:#eaf3ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-width:0;overflow-x:hidden;background:var(--bg);color:var(--text);font:12px "Malgun Gothic",Arial,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:100%;min-width:0}.topbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:3px 5px;padding:4px 6px;border-bottom:1px solid #9aa8b5;background:#dde7f1}.title{font-size:13px;font-weight:900}.pill,.tab{display:inline-flex;align-items:center;min-height:21px;padding:1px 5px;border:1px solid #9aa8b5;border-radius:3px;background:#fff;line-height:1.2;white-space:normal}.tab{font-weight:800;background:#edf3f8}.tab.active{color:#fff;border-color:#1d4ed8;background:#1d4ed8}.ok{color:var(--green);font-weight:900}.bad{color:var(--red);font-weight:900}.warn{color:#92400e;border-color:#facc15;background:#fef9c3;font-weight:900}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:3px 4px;background:#eef3f8;border-bottom:1px solid #aab7c6}.summary .pill{min-width:0}.section-head{display:flex;flex-wrap:wrap;align-items:center;gap:3px 7px;padding:3px 6px;border-top:1px solid #9aa8b5;border-bottom:1px solid #b8c3cf;background:var(--head);font-weight:900}.section-head.orange{color:#9a3412;background:#fff7ed}.section-head.blue{color:#1d4ed8;background:#eff6ff}.section-note{color:var(--muted);font-weight:600}.plus{color:var(--red);font-weight:900}.minus{color:var(--blue);font-weight:900}.zero{color:#4b5563}.state,.role{display:inline-flex;align-items:center;justify-content:center;min-height:16px;padding:0 4px;border-radius:3px;font-size:10px;font-weight:900}.surge,.lead{color:#991b1b;background:#fee2e2}.rising,.co{color:#9a3412;background:#ffedd5}.steady{color:#166534;background:#dcfce7}.cooling{color:#1e40af;background:#dbeafe}.wait-data,.watch{color:#374151;background:#e5e7eb}.follow{color:#1e40af;background:#dbeafe}.theme-radar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:4px;background:#eef3f8}.theme-card{min-width:0;padding:4px;border:1px solid #b8c4cf;border-radius:3px;background:#fff;cursor:pointer}.theme-card.selected{border-color:#2563eb;background:var(--selected)}.theme-card-head{display:flex;flex-wrap:wrap;align-items:center;gap:3px 5px}.card-rank{flex:0 0 21px;text-align:center;padding:1px 0;color:#fff;background:#4b5563;border-radius:2px;font-weight:900}.card-name{flex:1 1 100px;min-width:0;font-weight:900;overflow-wrap:anywhere}.card-flow{display:grid;grid-template-columns:28px minmax(0,1fr) 55px;align-items:center;gap:3px;margin-top:3px}.flow-track{height:6px;overflow:hidden;border-radius:2px;background:#e5e7eb}.flow-fill{height:100%;background:linear-gradient(90deg,#fecaca,#d71920)}.card-sub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 5px;margin-top:3px;color:#374151}.card-leaders{margin-top:3px;padding-top:3px;border-top:1px dashed #d4dce4;color:#374151;white-space:normal}.card-leader-link{display:inline;padding:0 2px;border:0;border-radius:2px;background:transparent;color:inherit;font:inherit;font-weight:900;cursor:pointer}.card-leader-link:hover,.card-leader-link:focus{color:#1d4ed8;background:#dbeafe;outline:none}.theme-list{display:grid;gap:3px;padding:4px;background:#fff}.theme-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px;padding:4px;border:1px solid var(--grid);border-radius:3px;background:#fff;cursor:pointer}.theme-row.selected{border-color:#4b78b8;background:var(--selected)}.theme-rank{display:flex;align-items:center;justify-content:center;border-radius:2px;color:#fff;background:#4b5563;font-size:14px;font-weight:900}.theme-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:4px;min-width:0}.theme-info,.theme-leader-panel{min-width:0}.theme-title-line{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-height:18px}.theme-name{font-size:12px;font-weight:900}.theme-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:2px}.metric-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px;align-items:center;min-width:0;padding:2px 3px;border:1px solid #d5dde5;border-radius:2px;background:#f8fafc}.metric-label{color:#64748b;white-space:nowrap}.metric-value{text-align:right;font-weight:900;overflow-wrap:anywhere}.theme-leaders{display:grid;grid-template-columns:1fr;gap:2px}.leader-chip{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px;align-items:center;min-width:0;padding:2px 3px;border:1px solid #d5dde5;border-radius:2px;background:#fbfdff;cursor:pointer}.leader-name{min-width:0;font-weight:900;overflow-wrap:anywhere}.leader-num{text-align:right;white-space:nowrap}.detail-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px;width:100%}.detail-summary{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 7px;color:#475569;font-weight:700}.member-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;padding:4px;background:#fff}.member-row{display:grid;grid-template-columns:auto minmax(0,1fr) 50px;gap:4px;align-items:start;padding:4px;border:1px solid var(--grid);border-radius:3px;background:#fff;cursor:pointer}.member-main{min-width:0}.member-top{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-height:18px}.member-name{font-weight:900}.member-code{color:#64748b}.member-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:2px}.member-stat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px;min-width:0;padding:2px 3px;border:1px solid #d5dde5;border-radius:2px;background:#f8fafc}.member-stat b{text-align:right;overflow-wrap:anywhere}.score-box{padding:3px 2px;border-radius:3px;text-align:center;font-weight:900}.score-a{color:#991b1b;background:#fee2e2}.score-b{color:#9a3412;background:#ffedd5}.score-c{color:#854d0e;background:#fef3c7}.score-d{color:#1e40af;background:#dbeafe}.score-f{color:#374151;background:#e5e7eb}.score-num{display:block;font-size:15px}.empty{padding:10px;text-align:center;color:#64748b;background:#fff}.footer{padding:5px 7px;border-top:1px solid #cbd5e1;color:#475569;background:#f8fafc}@media(max-width:1180px){.theme-radar{grid-template-columns:repeat(3,minmax(0,1fr))}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:900px){.title{width:100%}.theme-radar{grid-template-columns:repeat(2,minmax(0,1fr))}.theme-body{grid-template-columns:minmax(0,1fr) minmax(210px,.8fr)}.member-list{grid-template-columns:repeat(2,minmax(0,1fr))}.member-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.theme-body,.detail-head{grid-template-columns:1fr}.detail-summary{justify-content:flex-start}.member-list{grid-template-columns:1fr}}@media(max-width:520px){.theme-radar,.summary{grid-template-columns:1fr}.theme-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap"><div class="topbar"><span class="title">ThemeBoard v1 · 테마 돈쏠림 / 주도주</span><a class="tab" href="/">StockBoard v2</a><a class="tab active" href="/theme">테마·주도주</a><span id="clock" class="pill">-</span><span id="status" class="pill bad">연결 대기</span><span id="basisStatus" class="pill">표시기준 -</span><span id="cacheStatus" class="pill">cache -</span><span id="computeStatus" class="pill">compute -</span><span id="copyStatus" class="pill">종목 클릭=HTS/S1 연동</span></div><div class="summary"><span id="summaryTop5" class="pill">상위 5개 -</span><span id="summaryStrongest" class="pill">최고 유입 -</span><span id="summaryBreadth" class="pill">확산 -</span><span id="summaryWarning" class="pill">집중 경고 -</span></div><div class="section-head">상위 테마 레이더 <span class="section-note">10개 · 세로 태블릿 한 행 2개</span></div><div id="themeRadar" class="theme-radar"><div class="empty">테마 데이터 수신 대기</div></div><div class="section-head orange">테마 돈쏠림 순위 <span class="section-note">정보·주도주를 1행 2열로 압축</span></div><div id="themeList" class="theme-list"><div class="empty">테마 데이터 수신 대기</div></div><div class="section-head blue"><div class="detail-head"><span id="detailTitle">선택 테마 구성종목</span><span id="detailNote" class="detail-summary">-</span></div></div><div id="memberList" class="member-list"><div class="empty">테마를 선택하십시오.</div></div><div class="footer">HTML은 서버가 완성한 순서·문구·상태·막대 비율을 그대로 표시하며 계산하지 않습니다.</div></div>
<script>
const radarEl=document.getElementById('themeRadar'),themeListEl=document.getElementById('themeList'),memberListEl=document.getElementById('memberList'),detailTitleEl=document.getElementById('detailTitle'),detailNoteEl=document.getElementById('detailNote'),statusEl=document.getElementById('status'),basisStatusEl=document.getElementById('basisStatus'),cacheStatusEl=document.getElementById('cacheStatus'),computeStatusEl=document.getElementById('computeStatus'),copyStatusEl=document.getElementById('copyStatus'),summaryTop5El=document.getElementById('summaryTop5'),summaryStrongestEl=document.getElementById('summaryStrongest'),summaryBreadthEl=document.getElementById('summaryBreadth'),summaryWarningEl=document.getElementById('summaryWarning');let selectedThemeId=localStorage.getItem('stockboard.theme.selected.v1')||'',lastPayload=null,lastDetailVersion=-1,detailLoading=false,stream=null,fallbackTimer=null;
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}function cls(value){return String(value??'').replace(/[^a-zA-Z0-9_-]/g,'');}function widthValue(value){const text=String(value??'0');return /^\d+(\.\d+)?$/.test(text)?text:'0';}function tone(value){const safe=cls(value);return ['plus','minus','zero','warn'].includes(safe)?safe:'zero';}function findTheme(themes,id){for(const theme of themes){if(String(theme.theme_id||'')===id)return theme;}return null;}function leaderHtml(leader){return `<div class="leader-chip" data-code="${esc(leader.stock_code)}"><span class="leader-name">${esc(leader.stock_name)}</span><span class="leader-num ${tone(leader.change_rate_tone)}">${esc(leader.change_rate_text)}</span><span class="leader-num">${esc(leader.trade_value_text)}</span></div>`;}function themeCardHtml(theme){let leaders='';for(const leader of theme.leaders||[]){const code=String(leader.stock_code||'');const name=esc(leader.stock_name);const item=/^\d{6}$/.test(code)?`<button type="button" class="card-leader-link" data-code="${esc(code)}" title="${esc(code)} HTS 연동">${name}</button>`:name;leaders+=(leaders?' · ':'')+item;}return `<article class="theme-card ${String(theme.theme_id||'')===selectedThemeId?'selected':''}" data-theme-id="${esc(theme.theme_id)}"><div class="theme-card-head"><span class="card-rank">${esc(theme.display_rank)}</span><span class="card-name">${esc(theme.theme_name)}</span><span class="state ${cls(theme.state_class)}">${esc(theme.state_text)}</span></div><div class="card-flow"><span>1분</span><div class="flow-track"><div class="flow-fill" style="width:${widthValue(theme.inflow_1m_bar_pct)}%"></div></div><b class="${tone(theme.inflow_1m_tone)}">${esc(theme.inflow_1m_text)}</b></div><div class="card-flow"><span>5분</span><div class="flow-track"><div class="flow-fill" style="width:${widthValue(theme.inflow_5m_bar_pct)}%"></div></div><b class="${tone(theme.inflow_5m_tone)}">${esc(theme.inflow_5m_text)}</b></div><div class="card-sub"><span>누적 ${esc(theme.trade_value_text)}</span><span>점유 ${esc(theme.market_share_text)}</span><span>${esc(theme.breadth_text)}</span></div><div class="card-leaders"><b>주도</b> ${leaders||'-'}</div></article>`;}function metricHtml(label,text,className){return `<div class="metric-box"><span class="metric-label">${esc(label)}</span><span class="metric-value ${tone(className)}">${esc(text)}</span></div>`;}function themeRowHtml(theme){let leaders='';for(const leader of theme.leaders||[]){leaders+=leaderHtml(leader);}return `<article class="theme-row ${String(theme.theme_id||'')===selectedThemeId?'selected':''}" data-theme-id="${esc(theme.theme_id)}"><div class="theme-rank">${esc(theme.display_rank)}</div><div class="theme-body"><div class="theme-info"><div class="theme-title-line"><span class="theme-name">${esc(theme.theme_name)}</span><span class="state ${cls(theme.state_class)}">${esc(theme.state_text)}</span><span>${esc(theme.member_count_text)}</span><span class="${tone(theme.breadth_tone)}">${esc(theme.breadth_text)}</span></div><div class="theme-metrics">${metricHtml('1분',theme.inflow_1m_text,theme.inflow_1m_tone)}${metricHtml('5분',theme.inflow_5m_text,theme.inflow_5m_tone)}${metricHtml('누적',theme.trade_value_text,'zero')}${metricHtml('점유',theme.market_share_text,'zero')}${metricHtml('가속',theme.flow_accel_text,theme.flow_accel_tone)}${metricHtml('집중',theme.leader_concentration_text,theme.concentration_warning?'warn':'zero')}</div></div><div class="theme-leader-panel"><div class="theme-leaders">${leaders||'<div class="empty">주도주 대기</div>'}</div></div></div></article>`;}function memberStat(label,text,className){return `<div class="member-stat"><span>${esc(label)}</span><b class="${tone(className)}">${esc(text)}</b></div>`;}function memberHtml(member){return `<article class="member-row" data-code="${esc(member.stock_code)}"><span class="role ${cls(member.role_class)}">${esc(member.role_text)}</span><div class="member-main"><div class="member-top"><span class="member-name">${esc(member.stock_name)}</span><span class="member-code">${esc(member.stock_code)}</span><span>${esc(member.price_text)}</span><span class="${tone(member.change_rate_tone)}">${esc(member.change_rate_text)}</span><span>${esc(member.trade_value_text)}</span></div><div class="member-stats">${memberStat('비중',member.theme_share_text,'zero')}${memberStat('대금비',member.amount_ratio_text,member.amount_ratio_tone)}${memberStat('순간',member.execution_strength_text,member.execution_strength_tone)}${memberStat('5분',member.strength_5m_text,member.strength_5m_tone)}${memberStat('프로',member.program_net_text,member.program_net_tone)}${memberStat('대량',member.large_trade_text,member.large_trade_tone)}</div></div><div class="score-box ${cls(member.leader_score_class)}">주도력<span class="score-num">${esc(member.leader_score_text)}</span></div></article>`;}
async function loadDetail(themeId,version){if(!themeId||detailLoading)return;detailLoading=true;try{const response=await fetch(`/api/v2/themes/detail?theme_id=${encodeURIComponent(themeId)}&ts=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const detail=await response.json();lastDetailVersion=Number(detail.cache_version||version||0);detailTitleEl.textContent=`${detail.theme?.theme_name||'선택 테마'} 구성종목`;detailNoteEl.innerHTML=`<span>${esc(detail.theme?.member_count_text||'-')}</span><span>누적 ${esc(detail.theme?.trade_value_text||'-')}</span><span>점유 ${esc(detail.theme?.market_share_text||'-')}</span>`;const members=Array.isArray(detail.members)?detail.members:[];memberListEl.innerHTML=members.length?members.map(memberHtml).join(''):'<div class="empty">구성종목 데이터가 없습니다.</div>';}catch(error){memberListEl.innerHTML=`<div class="empty">구성종목 연결 실패: ${esc(error.message)}</div>`;}finally{detailLoading=false;}}
function render(payload,mode){lastPayload=payload;const themes=Array.isArray(payload.themes)?payload.themes:[];if(!selectedThemeId||!findTheme(themes,selectedThemeId)){selectedThemeId=String(themes[0]?.theme_id||'');if(selectedThemeId)localStorage.setItem('stockboard.theme.selected.v1',selectedThemeId);lastDetailVersion=-1;}radarEl.innerHTML=themes.length?themes.map(themeCardHtml).join(''):'<div class="empty">테마 데이터 수신 대기</div>';themeListEl.innerHTML=themes.length?themes.map(themeRowHtml).join(''):'<div class="empty">테마 데이터 수신 대기</div>';const status=payload.status||{},summary=payload.summary||{};statusEl.textContent=`${mode==='stream'?'연결 OK':'저속 연결'} · ${payload.market_session?.phase_label||status.state||'-'}`;statusEl.className=`pill ${mode==='stream'?'ok':'warn'}`;basisStatusEl.textContent=`표시기준 ${status.display_basis_text||'-'}${status.hold_until?` · ${String(status.hold_until).slice(5,16).replace('T',' ')}까지`:''}`;basisStatusEl.className=`pill ${status.display_basis==='LAST_CLOSE'?'warn':'ok'}`;cacheStatusEl.textContent=`cache ${payload.cache_version??'-'} · age ${status.cache_age_ms??'-'}ms`;computeStatusEl.textContent=`compute ${status.compute_ms??'-'}ms · copy ${status.copy_ms??'-'}ms`;summaryTop5El.textContent=summary.top5_concentration_text||'-';summaryStrongestEl.textContent=summary.strongest_flow_text||'-';summaryBreadthEl.textContent=summary.breadth_text||'-';summaryWarningEl.textContent=summary.warning_text||'-';summaryWarningEl.className=`pill ${tone(summary.warning_tone)}`;if(selectedThemeId&&lastDetailVersion!==Number(payload.cache_version||0))loadDetail(selectedThemeId,payload.cache_version);}function chooseTheme(id){if(!id)return;selectedThemeId=id;localStorage.setItem('stockboard.theme.selected.v1',id);lastDetailVersion=-1;if(lastPayload)render(lastPayload,'stream');loadDetail(id,lastPayload?.cache_version);}async function sendHts(code){const value=String(code||'');if(!/^\d{6}$/.test(value))return;const text=`SBV2|${Date.now()}|${value}`;try{await navigator.clipboard.writeText(text);copyStatusEl.textContent=`HTS 연동 ${value}`;copyStatusEl.className='pill ok';}catch(error){copyStatusEl.textContent=`HTS 연동 실패 ${value}`;copyStatusEl.className='pill bad';}setTimeout(()=>{copyStatusEl.textContent='종목 클릭=HTS/S1 연동';copyStatusEl.className='pill';},900);}document.addEventListener('click',event=>{const codeNode=event.target.closest('[data-code]');if(codeNode){event.stopPropagation();sendHts(codeNode.dataset.code);return;}const themeNode=event.target.closest('[data-theme-id]');if(themeNode)chooseTheme(themeNode.dataset.themeId);});async function fallback(){try{const response=await fetch(`/api/v2/themes/snapshot?ts=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);render(await response.json(),'poll');}catch(error){statusEl.textContent=`연결 실패 ${error.message}`;statusEl.className='pill bad';}}function connect(){if(!window.EventSource){fallbackTimer=setInterval(fallback,2000);fallback();return;}stream=new EventSource(`/api/v2/themes/stream?ts=${Date.now()}`);stream.addEventListener('snapshot',event=>{try{render(JSON.parse(event.data),'stream');}catch(error){statusEl.textContent=`데이터 오류 ${error.message}`;statusEl.className='pill bad';}});stream.onerror=()=>{statusEl.textContent='재연결 중';statusEl.className='pill warn';if(!fallbackTimer)fallbackTimer=setInterval(fallback,2000);};}setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false});},500);connect();
</script>
</body>
</html>
