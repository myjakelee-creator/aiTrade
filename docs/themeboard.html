<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>aiTrade ThemeBoard</title>
  <style>
    :root{--red:#d71920;--blue:#1266d6;--grid:#c8d2dc;--head:#e8eef5;--text:#111827;--muted:#6b7280;--bg:#f5f7fa}
    *{box-sizing:border-box}body{margin:0;font:12px Malgun Gothic,Arial,sans-serif;color:var(--text);background:var(--bg)}
    .topbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:#dde7f1;border-bottom:1px solid #aab7c6}
    .title{font-size:14px;font-weight:900}.badge{padding:3px 7px;border:1px solid #9aa8b5;border-radius:3px;background:#fff;white-space:nowrap}.ok{color:#067a2a;font-weight:800}.warn{color:#a16207;font-weight:800}.bad{color:var(--red);font-weight:800}
    .layout{display:grid;grid-template-columns:minmax(470px,44%) minmax(560px,56%);gap:6px;padding:6px}.panel{background:#fff;border:1px solid #aab7c6;min-width:0}.panel h2{margin:0;padding:5px 7px;background:var(--head);border-bottom:1px solid var(--grid);font-size:12px}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:5px;padding:6px}.summary-card{border:1px solid var(--grid);padding:6px;background:#fbfdff}.summary-card b{display:block;font-size:15px;margin-top:3px}.muted{color:var(--muted)}
    table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid var(--grid);padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:23px}th{background:var(--head);font-weight:800}tbody tr{background:#fff;cursor:pointer}tbody tr:hover{background:#eef6ff}tbody tr.selected{background:#dbeafe}.num{text-align:right;font-variant-numeric:tabular-nums}.center{text-align:center}.plus{color:var(--red);font-weight:800}.minus{color:var(--blue);font-weight:800}
    .status{display:inline-block;min-width:58px;text-align:center;padding:1px 4px;border-radius:3px;font-weight:800}.SURGE{background:#fee2e2;color:#b91c1c}.RISING{background:#ffedd5;color:#c2410c}.STEADY{background:#dcfce7;color:#166534}.COOLING{background:#dbeafe;color:#1d4ed8}.WAIT_DATA{background:#e5e7eb;color:#4b5563}
    .leader{font-weight:800}.detail-wrap{overflow:auto;max-height:calc(100vh - 135px)}.theme-wrap{overflow:auto;max-height:calc(100vh - 185px)}
    .empty{padding:24px;text-align:center;color:var(--muted)}
    @media(max-width:1050px){.layout{grid-template-columns:1fr}.theme-wrap,.detail-wrap{max-height:none}.summary{grid-template-columns:repeat(2,minmax(110px,1fr))}}
    @media(max-width:620px){body{font-size:11px}.layout{padding:3px;gap:3px}.summary{grid-template-columns:1fr 1fr}.topbar{padding:4px}.hide-narrow{display:none}}
  </style>
</head>
<body>
  <div class="topbar">
    <span class="title">aiTrade ThemeBoard</span>
    <span id="clock" class="badge">-</span>
    <span id="connection" class="badge bad">연결 대기</span>
    <span id="version" class="badge">version -</span>
    <span id="latency" class="badge">stream -</span>
    <span id="calc" class="badge">calc -</span>
    <span id="selection" class="badge">테마 선택 없음</span>
  </div>

  <div class="summary" id="summary"></div>

  <main class="layout">
    <section class="panel">
      <h2>테마 순위 · 1초 공유 캐시</h2>
      <div class="theme-wrap">
        <table id="theme-table">
          <colgroup><col style="width:42px"><col style="width:150px"><col style="width:62px"><col style="width:58px"><col style="width:76px"><col style="width:76px"><col style="width:62px"><col style="width:60px"><col></colgroup>
          <thead><tr><th>순위</th><th>테마</th><th>상태</th><th>점수</th><th>1분대금</th><th>5분대금</th><th>확산</th><th>Coverage</th><th>주도주</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2 id="detail-title">구성종목</h2>
      <div class="detail-wrap">
        <table id="detail-table">
          <colgroup><col style="width:42px"><col style="width:120px"><col style="width:70px"><col style="width:62px"><col style="width:72px"><col style="width:72px"><col style="width:64px"><col style="width:64px"><col style="width:68px"><col style="width:68px"><col style="width:58px"><col></colgroup>
          <thead><tr><th>순위</th><th>종목명</th><th>현재가</th><th>등락률</th><th>1분대금</th><th>5분대금</th><th>기여율</th><th>순간강도</th><th>5분강도</th><th>프로</th><th>주도력</th><th>역할</th></tr></thead>
          <tbody><tr><td colspan="12" class="empty">테마를 선택하십시오.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

<script>
  const $=id=>document.getElementById(id);
  const themeBody=$('theme-table').tBodies[0],detailBody=$('detail-table').tBodies[0];
  let selectedThemeId='',lastPayload=null,lastStreamAt=0,lastDetailVersion=0;
  const esc=v=>String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
  const fmt=(v,d=0)=>{const n=num(v);return n===null?'-':n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d})};
  const signed=v=>{const n=num(v);return n===null?'':n>0?'plus':n<0?'minus':''};
  const statusClass=v=>['SURGE','RISING','STEADY','COOLING','WAIT_DATA'].includes(String(v))?String(v):'WAIT_DATA';
  const ageMs=payload=>{const t=Number(payload?.updated_at)*1000;return Number.isFinite(t)?Math.max(0,Date.now()-t):null};

  function updateSummary(payload){
    const themes=payload.themes||[];
    const surge=themes.filter(t=>t.status==='SURGE').length;
    const rising=themes.filter(t=>t.status==='RISING').length;
    const ready=themes.filter(t=>t.coverage_status==='READY').length;
    const top=themes[0];
    $('summary').innerHTML=`
      <div class="summary-card"><span class="muted">유효 테마</span><b>${themes.length}</b></div>
      <div class="summary-card"><span class="muted">SURGE / RISING</span><b>${surge} / ${rising}</b></div>
      <div class="summary-card"><span class="muted">Coverage READY</span><b>${ready}</b></div>
      <div class="summary-card"><span class="muted">현재 1위</span><b>${esc(top?.theme_name||'-')}</b></div>`;
  }

  function renderThemes(payload){
    const themes=payload.themes||[];
    if(!selectedThemeId&&themes[0])selectedThemeId=themes[0].theme_id;
    themeBody.innerHTML=themes.length?themes.map(t=>`<tr data-theme-id="${esc(t.theme_id)}" class="${t.theme_id===selectedThemeId?'selected':''}">
      <td class="center">${fmt(t.rank)}</td><td><b>${esc(t.theme_name)}</b></td>
      <td class="center"><span class="status ${statusClass(t.status)}">${esc(t.status)}</span></td>
      <td class="num">${fmt(t.score,1)}</td><td class="num">${fmt(t.trade_value_1m_eok,1)}</td><td class="num">${fmt(t.trade_value_5m_eok,1)}</td>
      <td class="num">${fmt(t.breadth_pct,0)}%</td><td class="num">${fmt(t.coverage_pct,0)}%</td><td class="leader">${esc(t.leader_name||'-')}</td>
    </tr>`).join(''):`<tr><td colspan="9" class="empty">테마 데이터 준비 중</td></tr>`;
    themeBody.querySelectorAll('tr[data-theme-id]').forEach(row=>row.addEventListener('click',()=>selectTheme(row.dataset.themeId)));
  }

  async function selectTheme(themeId){
    selectedThemeId=String(themeId||'');
    $('selection').textContent=`선택 ${selectedThemeId}`;
    renderThemes(lastPayload||{themes:[]});
    await loadDetail(true);
  }

  async function loadDetail(force=false){
    if(!selectedThemeId||!lastPayload)return;
    if(!force&&lastDetailVersion===lastPayload.version)return;
    try{
      const res=await fetch(`/api/v2/theme?theme_id=${encodeURIComponent(selectedThemeId)}&ts=${Date.now()}`,{cache:'no-store'});
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      const payload=await res.json();
      lastDetailVersion=payload.version||lastPayload.version||0;
      renderDetail(payload.theme||{});
    }catch(error){detailBody.innerHTML=`<tr><td colspan="12" class="empty">상세 조회 실패: ${esc(error.message)}</td></tr>`;}
  }

  function renderDetail(theme){
    $('detail-title').textContent=`${theme.theme_name||'구성종목'} · ${theme.active_member_count||0}/${theme.master_member_count||0}종목 · Coverage ${fmt(theme.coverage_pct,0)}%`;
    const members=theme.members||[];
    detailBody.innerHTML=members.length?members.map((m,i)=>`<tr data-code="${esc(m.stock_code)}">
      <td class="center">${i+1}</td><td><b>${esc(m.stock_name||m.stock_code)}</b></td><td class="num">${fmt(m.price)}</td>
      <td class="num ${signed(m.change_rate)}">${num(m.change_rate)!==null&&num(m.change_rate)>0?'+':''}${fmt(m.change_rate,2)}%</td>
      <td class="num">${fmt(m.trade_value_1m_eok,1)}</td><td class="num">${fmt(m.trade_value_5m_eok,1)}</td><td class="num">${fmt(m.contribution_pct,1)}%</td>
      <td class="num">${fmt(m.execution_strength,0)}</td><td class="num">${fmt(m.strength_5m,0)}</td><td class="num ${signed(m.program_net)}">${fmt(m.program_net,1)}</td>
      <td class="num">${fmt(m.leadership_score,1)}</td><td class="center">${esc(m.leadership_role||'관찰')}</td></tr>`).join(''):`<tr><td colspan="12" class="empty">유효 구성종목 없음</td></tr>`;
    detailBody.querySelectorAll('tr[data-code]').forEach(row=>row.addEventListener('click',()=>linkStock(row.dataset.code)));
  }

  async function linkStock(code){
    if(!/^\d{6}$/.test(String(code||'')))return;
    const command=`SBV2|${Date.now()}|${code}`;
    try{await navigator.clipboard.writeText(command);$('selection').textContent=`HTS 연동 ${code}`;}
    catch(_e){$('selection').textContent=`클립보드 실패 ${code}`;}
  }

  function render(payload,mode='stream'){
    lastPayload=payload;lastStreamAt=performance.now();updateSummary(payload);renderThemes(payload);loadDetail(false);
    $('connection').textContent='연결 정상';$('connection').className='badge ok';$('version').textContent=`version ${payload.version??'-'}`;
    const age=ageMs(payload);$('latency').textContent=`${mode} ${age===null?'-':Math.round(age)}ms`;
    $('calc').textContent=`calc ${fmt(payload.status?.calculate_ms,1)}ms`;
  }

  function connect(){
    const es=new EventSource(`/api/v2/theme_stream?interval_ms=250&ts=${Date.now()}`);
    es.addEventListener('themes',event=>{try{render(JSON.parse(event.data),'stream')}catch(error){console.warn(error)}});
    es.onerror=()=>{$('connection').textContent='재연결 중';$('connection').className='badge warn'};
  }

  setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false});if(lastPayload&&performance.now()-lastStreamAt>3000){$('connection').textContent='heartbeat 대기';$('connection').className='badge warn'}},500);
  $('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false});connect();
</script>
</body>
</html>
