<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockBoard Replay</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #172033;
      --line: rgba(255, 255, 255, 0.10);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --hot: #fb7185;
      --good: #60a5fa;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --chip: rgba(255, 255, 255, 0.08);
      --stable: rgba(34, 197, 94, 0.22);
      --raw: rgba(251, 191, 36, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: linear-gradient(90deg, #3f0f18, #111827 42%, #0f172a);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-right: 6px;
    }

    .watermark {
      color: white;
      background: #dc2626;
      border: 1px solid rgba(255,255,255,0.24);
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .safe {
      color: #d1fae5;
      background: rgba(16,185,129,0.18);
      border: 1px solid rgba(16,185,129,0.45);
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .chip {
      background: var(--chip);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 999px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    button, select {
      background: #1f2937;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font: inherit;
      min-height: 34px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { background: #263244; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    #minuteSelect {
      min-width: 280px;
      flex: 1 1 320px;
    }

    #modelSelect {
      min-width: 210px;
      flex: 0 1 270px;
    }

    #speedSelect {
      min-width: 150px;
    }

    .status {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 260px;
    }

    main {
      padding: 12px 14px 28px;
      display: grid;
      gap: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(360px, 0.95fr) minmax(720px, 1.8fr);
      gap: 12px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.20);
    }

    .panel h2 {
      font-size: 14px;
      margin: 0;
      padding: 10px 12px;
      background: var(--panel2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .panel-body { padding: 10px 12px; }

    .candidate-list {
      display: grid;
      gap: 8px;
    }

    .candidate-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.035);
      display: grid;
      gap: 4px;
    }

    .candidate-card.rank1 {
      background: linear-gradient(90deg, rgba(251,113,133,0.22), rgba(255,255,255,0.04));
      border-color: rgba(251,113,133,0.55);
    }

    .candidate-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .name {
      font-weight: 800;
      font-size: 14px;
    }

    .code {
      color: var(--muted);
      font-size: 12px;
      margin-left: 4px;
    }

    .score {
      font-weight: 900;
      color: #fde68a;
    }

    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .metric {
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .table-scroll {
      overflow: auto;
      max-height: calc(100vh - 335px);
      position: relative;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 6px 7px;
      white-space: nowrap;
      text-align: right;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 12;
      background: #172033;
      color: #cbd5e1;
      font-weight: 800;
      box-shadow: 0 1px 0 rgba(255,255,255,0.08);
    }

    td.name-cell, th.name-cell { text-align: left; }

    tbody tr:hover { background: rgba(255,255,255,0.06); }
    tbody tr.stable-row { background: var(--stable); }
    tbody tr.raw-row:not(.stable-row) { background: var(--raw); }

    .up { color: #fca5a5; font-weight: 800; }
    .down { color: #93c5fd; font-weight: 800; }
    .flat { color: #cbd5e1; }

    .badge {
      display: inline-block;
      min-width: 38px;
      text-align: center;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .badge-stable { color: #bbf7d0; background: rgba(34,197,94,0.18); }
    .badge-raw { color: #fde68a; background: rgba(251,191,36,0.16); }
    .badge-play { color: #bfdbfe; background: rgba(59,130,246,0.18); }

    .empty {
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }

    .error {
      background: rgba(248,113,113,0.14);
      border: 1px solid rgba(248,113,113,0.35);
      color: #fecaca;
      padding: 10px 12px;
      border-radius: 12px;
      white-space: pre-wrap;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr; }
      .table-scroll { max-height: calc(100vh - 390px); }
    }
  </style>
</head>
<body>
  <header>
    <div class="topline">
      <div class="title">StockBoard Replay</div>
      <div class="watermark">REPLAY MODE</div>
      <div class="safe">NO BROKER · NO ORDER · READ ONLY</div>
      <div id="sessionChip" class="chip">session: -</div>
      <div id="minuteChip" class="chip">minute: -</div>
      <div id="speedChip" class="chip">speed: -</div>
      <div id="safetyChip" class="chip">safety: checking</div>
    </div>

    <div class="toolbar">
      <button id="firstBtn" type="button">|← 처음</button>
      <button id="prevBtn" type="button">← 이전 1분</button>
      <button id="playBtn" type="button">▶ 재생</button>
      <button id="nextBtn" type="button">다음 1분 →</button>
      <button id="lastBtn" type="button">끝 →|</button>

      <select id="speedSelect" title="재생 속도">
        <option value="1">1x 실제속도</option>
        <option value="5">5x</option>
        <option value="10">10x</option>
        <option value="30">30x</option>
        <option value="60" selected>60x · 1분/초</option>
        <option value="120">120x</option>
        <option value="300">300x</option>
      </select>

      <select id="minuteSelect" title="리플레이 분 선택"></select>
      <select id="modelSelect" title="후보모델 선택"></select>
      <button id="reloadBtn" type="button">새로고침</button>
      <div id="status" class="status">초기화 중...</div>
    </div>
  </header>

  <main>
    <div id="errorBox" class="error" style="display:none"></div>

    <section class="grid">
      <div class="panel">
        <h2>
          <span>Stable 후보 Top5</span>
          <span id="stableCount" class="small">-</span>
        </h2>
        <div class="panel-body">
          <div id="stableCandidates" class="candidate-list"></div>
        </div>
      </div>

      <div class="panel">
        <h2>
          <span>Raw 후보 Top5</span>
          <span id="rawCount" class="small">-</span>
        </h2>
        <div class="panel-body">
          <div id="rawCandidates" class="candidate-list"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>
        <span>Replay Rows</span>
        <span id="rowCount" class="small">-</span>
      </h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th class="name-cell">종목</th>
              <th>현재가</th>
              <th>등락률</th>
              <th>1분대금(억)</th>
              <th>체결강도</th>
              <th>잔량비</th>
              <th>프로그램</th>
              <th>M7</th>
              <th>후보</th>
            </tr>
          </thead>
          <tbody id="rowsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = window.REPLAY_API_BASE || 'http://127.0.0.1:18001';

    const state = {
      sessions: [],
      minutes: [],
      currentIndex: 0,
      sessionId: null,
      modelId: 'OPENING_BURST_V01',
      frame: null,
      playing: false,
      timer: null,
      speed: 60
    };

    const el = {
      sessionChip: document.getElementById('sessionChip'),
      minuteChip: document.getElementById('minuteChip'),
      speedChip: document.getElementById('speedChip'),
      safetyChip: document.getElementById('safetyChip'),
      status: document.getElementById('status'),
      errorBox: document.getElementById('errorBox'),
      firstBtn: document.getElementById('firstBtn'),
      prevBtn: document.getElementById('prevBtn'),
      playBtn: document.getElementById('playBtn'),
      nextBtn: document.getElementById('nextBtn'),
      lastBtn: document.getElementById('lastBtn'),
      reloadBtn: document.getElementById('reloadBtn'),
      speedSelect: document.getElementById('speedSelect'),
      minuteSelect: document.getElementById('minuteSelect'),
      modelSelect: document.getElementById('modelSelect'),
      stableCandidates: document.getElementById('stableCandidates'),
      rawCandidates: document.getElementById('rawCandidates'),
      stableCount: document.getElementById('stableCount'),
      rawCount: document.getElementById('rawCount'),
      rowCount: document.getElementById('rowCount'),
      rowsBody: document.getElementById('rowsBody')
    };

    function setStatus(text) {
      el.status.textContent = text;
    }

    function showError(error) {
      const text = error instanceof Error ? error.message : String(error);
      el.errorBox.textContent = text;
      el.errorBox.style.display = 'block';
      stopPlayback();
      setStatus('오류');
    }

    function clearError() {
      el.errorBox.style.display = 'none';
      el.errorBox.textContent = '';
    }

    async function fetchReplay(path) {
      const response = await fetch(`${API_BASE}${path}`, { cache: 'no-store' });
      if (!response.ok) {
        const body = await response.text();
        throw new Error(`Replay API 오류 ${response.status}: ${path}\n${body.slice(0, 600)}`);
      }
      return response.json();
    }

    function fmtNumber(value, digits = 0) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '-';
      return number.toLocaleString('ko-KR', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function fmtPrice(value) {
      return fmtNumber(value, 0);
    }

    function fmtPct(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '-';
      return `${number > 0 ? '+' : ''}${number.toFixed(2)}%`;
    }

    function fmtEok(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '-';
      if (Math.abs(number) >= 100) return fmtNumber(number, 1);
      return fmtNumber(number, 2);
    }

    function clsChange(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number === 0) return 'flat';
      return number > 0 ? 'up' : 'down';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function speedLabel() {
      if (state.speed === 1) return '1x 실제속도';
      if (state.speed === 60) return '60x · 1분/초';
      return `${state.speed}x`;
    }

    function playbackIntervalMs() {
      const speed = Number(state.speed) || 60;
      return Math.max(120, Math.round(60000 / speed));
    }

    function updatePlayButton() {
      el.playBtn.textContent = state.playing ? '⏸ 정지' : '▶ 재생';
      el.playBtn.classList.toggle('badge-play', state.playing);
      el.speedChip.textContent = `speed: ${speedLabel()}`;
    }

    function candidateCard(candidate, index, stable) {
      const rank = candidate.rank ?? index + 1;
      const score = fmtNumber(candidate.score, 2);
      const grade = candidate.grade_text || '-';
      const cls = Number(rank) === 1 ? 'candidate-card rank1' : 'candidate-card';
      const scoreLabel = stable ? 'stable' : 'raw';
      return `
        <div class="${cls}">
          <div class="candidate-head">
            <div>
              <span class="badge ${stable ? 'badge-stable' : 'badge-raw'}">#${escapeHtml(rank)}</span>
              <span class="name">${escapeHtml(candidate.stock_name)}</span>
              <span class="code">${escapeHtml(candidate.stock_code)}</span>
            </div>
            <div class="score">${escapeHtml(grade)} · ${score}</div>
          </div>
          <div class="metrics">
            <span class="metric">${scoreLabel}</span>
            <span class="metric">대금 ${fmtEok(candidate.trade_value_eok)}억</span>
            <span class="metric">강도 ${fmtNumber(candidate.execution_strength, 2)}</span>
            <span class="metric">등락 ${fmtPct(candidate.change_rate)}</span>
            <span class="metric">M7 ${fmtNumber(candidate.trade_metric_7_delta_in_min, 0)}</span>
          </div>
        </div>
      `;
    }

    function renderCandidateList(target, candidates, stable) {
      if (!candidates || candidates.length === 0) {
        target.innerHTML = '<div class="empty">후보 없음</div>';
        return;
      }
      target.innerHTML = candidates.map((candidate, index) => candidateCard(candidate, index, stable)).join('');
    }

    function renderRows(rows) {
      if (!rows || rows.length === 0) {
        el.rowsBody.innerHTML = '<tr><td colspan="10" class="empty">rows 없음</td></tr>';
        return;
      }

      el.rowsBody.innerHTML = rows.map(row => {
        const stable = Boolean(row.is_stable_candidate);
        const raw = Boolean(row.is_raw_candidate);
        const trClass = stable ? 'stable-row' : (raw ? 'raw-row' : '');
        const flags = [
          stable ? '<span class="badge badge-stable">STABLE</span>' : '',
          raw ? '<span class="badge badge-raw">RAW</span>' : ''
        ].filter(Boolean).join(' ');

        return `
          <tr class="${trClass}">
            <td>${escapeHtml(row.rank)}</td>
            <td class="name-cell"><b>${escapeHtml(row.stock_name)}</b> <span class="code">${escapeHtml(row.stock_code)}</span></td>
            <td>${fmtPrice(row.price)}</td>
            <td class="${clsChange(row.change_rate)}">${fmtPct(row.change_rate)}</td>
            <td>${fmtEok(row.trade_value_eok)}</td>
            <td>${fmtNumber(row.execution_strength, 2)}</td>
            <td>${fmtNumber(row.bid_ask_ratio, 2)}</td>
            <td>${fmtNumber(row.program_net, 0)}</td>
            <td>${fmtNumber(row.trade_metric_7_delta_in_min, 0)}</td>
            <td>${flags || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    function updateControls() {
      const lastIndex = state.minutes.length - 1;
      el.firstBtn.disabled = state.currentIndex <= 0;
      el.prevBtn.disabled = state.currentIndex <= 0;
      el.nextBtn.disabled = state.currentIndex >= lastIndex;
      el.lastBtn.disabled = state.currentIndex >= lastIndex;
      el.minuteSelect.value = String(state.currentIndex);
      el.sessionChip.textContent = `session: ${state.sessionId || '-'}`;
      if (state.frame) {
        el.minuteChip.textContent = `minute: ${state.frame.minute || '-'}`;
      }
      updatePlayButton();
    }

    function renderFrame(frame) {
      state.frame = frame;
      state.currentIndex = Number(frame.minute_index ?? state.currentIndex);

      const candidates = frame.candidates || {};
      const stableDefault = candidates.stable_default || [];
      const rawDefault = candidates.raw_default || [];
      const rows = frame.rows || [];
      const safety = frame.safety || {};

      el.safetyChip.textContent = safety.replay_only ? 'safety: replay only' : 'safety: unknown';
      el.stableCount.textContent = `${stableDefault.length}개`;
      el.rawCount.textContent = `${rawDefault.length}개`;
      el.rowCount.textContent = `${rows.length} rows`;

      renderCandidateList(el.stableCandidates, stableDefault, true);
      renderCandidateList(el.rawCandidates, rawDefault, false);
      renderRows(rows);
      updateControls();

      const playState = state.playing ? ` · 재생중 ${speedLabel()}` : '';
      setStatus(`loaded ${frame.minute} · rows ${rows.length} · model ${state.modelId}${playState}`);
    }

    async function loadFrameByIndex(index) {
      clearError();
      const safeIndex = Math.max(0, Math.min(index, state.minutes.length - 1));
      const modelParam = encodeURIComponent(state.modelId);
      const frame = await fetchReplay(`/api/replay/frame?index=${safeIndex}&model=${modelParam}`);
      renderFrame(frame);
    }

    function scheduleNextFrame() {
      if (!state.playing) return;
      clearTimeout(state.timer);
      state.timer = window.setTimeout(async () => {
        try {
          if (state.currentIndex >= state.minutes.length - 1) {
            stopPlayback();
            setStatus('재생 완료');
            return;
          }
          await loadFrameByIndex(state.currentIndex + 1);
          scheduleNextFrame();
        } catch (error) {
          showError(error);
        }
      }, playbackIntervalMs());
    }

    async function startPlayback() {
      if (state.playing) return;
      if (!state.minutes.length) return;
      state.playing = true;
      updateControls();

      if (state.currentIndex >= state.minutes.length - 1) {
        await loadFrameByIndex(0);
      }

      setStatus(`재생 시작 · ${speedLabel()} · interval ${playbackIntervalMs()}ms`);
      scheduleNextFrame();
    }

    function stopPlayback() {
      state.playing = false;
      if (state.timer) {
        clearTimeout(state.timer);
        state.timer = null;
      }
      updateControls();
    }

    async function togglePlayback() {
      if (state.playing) {
        stopPlayback();
        setStatus('정지');
      } else {
        await startPlayback();
      }
    }

    async function loadInitial() {
      clearError();
      setStatus('replay server 연결 중...');

      const health = await fetchReplay('/api/replay/health');
      if (!health.safety || health.safety.live_api_reuse !== false || health.safety.order_enabled !== false) {
        throw new Error('Replay safety flag가 예상과 다릅니다.');
      }

      const sessions = await fetchReplay('/api/replay/sessions');
      state.sessions = sessions.sessions || [];
      state.sessionId = sessions.default_session_id;

      const minutes = await fetchReplay('/api/replay/minutes');
      state.minutes = minutes.minutes || [];

      el.minuteSelect.innerHTML = state.minutes.map(item => {
        const index = Number(item.minute_index);
        const label = `${item.minute} (${item.row_count} rows)`;
        return `<option value="${index}">${escapeHtml(label)}</option>`;
      }).join('');

      const firstSession = state.sessions[0] || {};
      const modelIds = ((firstSession.summary || {}).models || [])
        .map(item => item.requested_model_id || item.resolved_model_id)
        .filter(Boolean);

      const fallbackModels = ['OPENING_BURST_V01', 'OPENING_MONEY_FLOW_V01', 'PROGRAM_FLOW_V01'];
      const uniqueModels = [...new Set([...modelIds, ...fallbackModels])];

      el.modelSelect.innerHTML = uniqueModels.map(model => {
        const selected = model === state.modelId ? ' selected' : '';
        return `<option value="${escapeHtml(model)}"${selected}>${escapeHtml(model)}</option>`;
      }).join('');

      el.speedSelect.value = String(state.speed);

      if (state.minutes.length === 0) {
        throw new Error('Replay minutes가 없습니다.');
      }

      await loadFrameByIndex(0);
    }

    el.firstBtn.addEventListener('click', () => {
      loadFrameByIndex(0).catch(showError);
    });

    el.prevBtn.addEventListener('click', () => {
      loadFrameByIndex(state.currentIndex - 1).catch(showError);
    });

    el.playBtn.addEventListener('click', () => {
      togglePlayback().catch(showError);
    });

    el.nextBtn.addEventListener('click', () => {
      loadFrameByIndex(state.currentIndex + 1).catch(showError);
    });

    el.lastBtn.addEventListener('click', () => {
      loadFrameByIndex(state.minutes.length - 1).catch(showError);
    });

    el.reloadBtn.addEventListener('click', () => {
      loadFrameByIndex(state.currentIndex).catch(showError);
    });

    el.speedSelect.addEventListener('change', event => {
      state.speed = Number(event.target.value) || 60;
      updateControls();
      if (state.playing) {
        setStatus(`배속 변경 · ${speedLabel()}`);
        scheduleNextFrame();
      }
    });

    el.minuteSelect.addEventListener('change', event => {
      loadFrameByIndex(Number(event.target.value)).catch(showError);
    });

    el.modelSelect.addEventListener('change', event => {
      state.modelId = event.target.value;
      loadFrameByIndex(state.currentIndex).catch(showError);
    });

    window.addEventListener('keydown', event => {
      const tag = String(event.target && event.target.tagName || '').toUpperCase();
      if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;

      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        if (!el.prevBtn.disabled) loadFrameByIndex(state.currentIndex - 1).catch(showError);
      }
      if (event.key === 'ArrowRight') {
        event.preventDefault();
        if (!el.nextBtn.disabled) loadFrameByIndex(state.currentIndex + 1).catch(showError);
      }
      if (event.key === 'Home') {
        event.preventDefault();
        loadFrameByIndex(0).catch(showError);
      }
      if (event.key === 'End') {
        event.preventDefault();
        loadFrameByIndex(state.minutes.length - 1).catch(showError);
      }
      if (event.key === ' ') {
        event.preventDefault();
        togglePlayback().catch(showError);
      }
    });

    loadInitial().catch(showError);
  </script>
</body>
</html>
