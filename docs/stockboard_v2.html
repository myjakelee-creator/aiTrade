<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockBoard v2 Realtime</title>
  <style>
    :root { --red:#d71920; --blue:#1266d6; --grid:#c7d1dc; --head:#eaf0f6; --text:#111827; --topbar-height:82px; }
    html, body { overflow-x:auto; }
    body { margin:0; min-width:100vw; font-family: Malgun Gothic, Arial, sans-serif; font-size:12px; color:var(--text); background:#f8fafc; }
    .window { min-width:max-content; }
    .topbar { position:sticky; top:0; z-index:8; display:flex; flex-wrap:wrap; gap:4px 8px; align-items:flex-start; padding:5px 8px; border-bottom:1px solid #aab7c6; background:#dde7f1; min-width:0; white-space:normal; }
    .metric-row { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; width:100%; min-width:0; }
    .title { font-weight:800; }
    .badge { padding:2px 6px; border:1px solid #9aa8b5; background:white; border-radius:3px; white-space:nowrap; }
    .ok { color:#067a2a; font-weight:800; }
    .bad { color:var(--red); font-weight:800; }
    .warn { color:#a16207; border-color:#facc15; background:#fef9c3; font-weight:800; }
    .copy-ok { color:#166534; border-color:#86efac; background:#dcfce7; font-weight:800; }
    .small { color:#4b5563; }
    .control { height:22px; font-family:inherit; font-size:12px; border:1px solid #9aa8b5; background:white; border-radius:3px; }
    .section { padding:3px 6px; font-weight:800; border-top:1px solid #9aa8b5; border-bottom:1px solid #b8c3cf; background:#eef4fb; }
    .section.orange { color:#b45309; background:#fff7ed; }
    .section.blue { color:#1d4ed8; background:#eff6ff; }
    .section .lane { margin-left:8px; color:#6b7280; font-weight:600; }
    table { border-collapse:collapse; table-layout:fixed; background:white; width:1048px; min-width:1048px; }
    th, td { box-sizing:border-box; border:1px solid var(--grid); padding:2px 4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; height:20px; min-width:0 !important; max-width:none; }
    th { background:var(--head); font-weight:800; user-select:none; cursor:pointer; }
    th[data-sort-dir="asc"] .header-label::after { content:" ▲"; color:#1d4ed8; }
    th[data-sort-dir="desc"] .header-label::after { content:" ▼"; color:#b91c1c; }
    .board { margin:0; }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .center { text-align:center; }
    .plus { color:var(--red); font-weight:700; }
    .minus { color:var(--blue); font-weight:700; }
    .zero { color:#4b5563; }
    .ratio-hot { color:var(--red); font-weight:700; }
    .ratio-cold { color:var(--blue); font-weight:700; }
    .stock-name-copy { cursor:pointer; text-decoration: underline dotted rgba(31,41,55,.35); text-underline-offset:2px; }
    .selected-row { background:#fff3c4; }
    tr.hot { background:#fff7d6; }
    tr.stale { opacity:.55; }
    .grade { display:inline-block; min-width:32px; padding:0 3px; border-radius:3px; background:#e5e7eb; font-weight:800; }
    .grade.a { background:#fee2e2; color:#b91c1c; }
    .grade.b { background:#ffedd5; color:#c2410c; }
    .grade.c { background:#fef3c7; color:#a16207; }
    .grade.d { background:#dbeafe; color:#1d4ed8; }
    .grade.f { background:#e5e7eb; color:#374151; }
    .mini-candle { position:relative; height:14px; width:76px; margin:0 auto; background:#edf2f7; border-radius:2px; overflow:hidden; }
    .mini-candle .wick { position:absolute; left:var(--wick-left); width:var(--wick-width); top:6px; height:2px; background:#1f2937; }
    .mini-candle .body { position:absolute; left:var(--body-left); width:var(--body-width); top:3px; height:8px; min-width:2px; background:#ef4444; }
    .mini-candle.down .body { background:#3b82f6; }
    .mini-candle.flat .body { background:#6b7280; }
    col.rank { width:46px; } col.prev { width:52px; } col.grade { width:50px; } col.name { width:132px; }
    col.price { width:78px; } col.rate { width:68px; } col.value { width:78px; } col.amount-ratio { width:62px; }
    col.candle { width:86px; } col.balance { width:66px; } col.strength { width:70px; } col.minstrength { width:70px; }
    col.program { width:68px; } col.large { width:70px; }
  </style>
</head>
<body>
<div class="window">
  <div id="topbar" class="topbar">
    <div class="metric-row">
      <span class="title">StockBoard v2 Realtime</span>
      <span id="clock" class="badge">-</span>
      <span id="status" class="badge bad">연결 대기</span>
      <label class="badge">선발기준 <select id="candidate-model-selector" class="control" disabled><option value="">모델 설정 로딩</option></select></label>
      <span id="copy-status" class="badge">종목명 클릭=HTS연동</span>
    </div>
    <div class="metric-row">
      <span id="counts" class="badge">rows 0 · events 0 · trades 0</span>
      <span id="latency" class="badge">stream - ms</span>
      <span id="throughput" class="badge">recv/s - · trade/s -</span>
      <span id="collector-metrics" class="badge">collector_q - · sent/s -</span>
      <span id="worker-metrics" class="badge">worker_q - · drop -</span>
    </div>
    <div class="metric-row">
      <span id="lag-metrics" class="badge">top20 lag - · stale - · rt -</span>
      <span id="render-metrics" class="badge">render - ms</span>
      <span class="small">fast-open: 체결 우선 · orderbook OFF 가능 · 일봉은 기존 OHLC가 있을 때만 CSS 미니캔들</span>
    </div>
  </div>

  <div class="section orange">S1 선택 종목 <span id="selected-row-count" class="lane">0종목</span></div>
  <table class="board" id="selected-board" aria-label="S1 선택 종목"></table>

  <div class="section orange">집중 후보 <span id="focus-row-count" class="lane">Top20</span></div>
  <table class="board" id="focus-board" aria-label="집중 후보"></table>

  <div class="section blue">Top300 Pool <span id="pool-row-count" class="lane">0종목</span></div>
  <table class="board" id="pool-board" aria-label="Top300 Pool"></table>
</div>

<script>
  const topbarEl = document.getElementById('topbar');
  const selectedBoardEl = document.getElementById('selected-board');
  const focusBoardEl = document.getElementById('focus-board');
  const poolBoardEl = document.getElementById('pool-board');
  const selectedRowCountEl = document.getElementById('selected-row-count');
  const focusRowCountEl = document.getElementById('focus-row-count');
  const poolRowCountEl = document.getElementById('pool-row-count');
  const statusEl = document.getElementById('status');
  const countsEl = document.getElementById('counts');
  const latencyEl = document.getElementById('latency');
  const throughputEl = document.getElementById('throughput');
  const collectorMetricsEl = document.getElementById('collector-metrics');
  const workerMetricsEl = document.getElementById('worker-metrics');
  const lagMetricsEl = document.getElementById('lag-metrics');
  const renderMetricsEl = document.getElementById('render-metrics');
  const clockEl = document.getElementById('clock');
  const copyStatusEl = document.getElementById('copy-status');
  const candidateModelSelector = document.getElementById('candidate-model-selector');

  const STORAGE_KEYS = {
    sort: 'stockboard.v2.sort',
    selectedCode: 'stockboard.v2.selectedCode',
    candidateModel: 'stockboard.candidateModel.v1'
  };
  const columns = [
    { key:'rank', label:'순위', className:'center', colClass:'rank', sort:'rank' },
    { key:'rank_change', label:'전일', className:'center', colClass:'prev', sort:'rank_change' },
    { key:'grade', label:'등급', className:'center', colClass:'grade', sort:'grade_score' },
    { key:'stock_name', label:'종목명', className:'', colClass:'name', sort:'stock_name' },
    { key:'price', label:'현재가', className:'num', colClass:'price', sort:'price' },
    { key:'change_rate', label:'등락률', className:'num', colClass:'rate', sort:'change_rate' },
    { key:'trade_value_eok', label:'금액(억)', className:'num', colClass:'value', sort:'trade_value_eok' },
    { key:'amount_ratio', label:'대금비', className:'num', colClass:'amount-ratio', sort:'amount_ratio' },
    { key:'daily_candle', label:'일봉', className:'center', colClass:'candle', sort:null },
    { key:'bid_ask_ratio', label:'잔량비', className:'num', colClass:'balance', sort:'bid_ask_ratio' },
    { key:'execution_strength', label:'순간강도', className:'num', colClass:'strength', sort:'execution_strength' },
    { key:'strength_1m', label:'1분강도', className:'num', colClass:'minstrength', sort:'strength_1m' },
    { key:'program_net', label:'프로(억)', className:'num', colClass:'program', sort:'program_net' },
    { key:'large_trade_net_count', label:'대량체결', className:'num', colClass:'large', sort:'large_trade_net_count' }
  ];

  let lastPayload = null;
  let lastStreamAt = 0;
  let fallbackTimer = null;
  let stream = null;
  let copyTimer = null;
  let htsLinkSeq = 0;
  let rateSample = null;
  let selectedCode = localStorage.getItem(STORAGE_KEYS.selectedCode) || '';
  let lastPoolRenderAt = 0;
  let sortState = loadSortState();

  function updateTopbarHeight() {
    const height = Math.ceil(topbarEl.getBoundingClientRect().height || 82);
    document.documentElement.style.setProperty('--topbar-height', `${height}px`);
  }
  window.addEventListener('resize', updateTopbarHeight);

  function tableSkeleton() {
    return `<colgroup>${columns.map(col => `<col class="${col.colClass}">`).join('')}</colgroup><thead><tr>${columns.map(col => `<th class="${col.className}" ${col.sort ? `data-sort-key="${col.sort}"` : ''}><span class="header-label">${col.label}</span></th>`).join('')}</tr></thead><tbody></tbody>`;
  }
  selectedBoardEl.innerHTML = tableSkeleton();
  focusBoardEl.innerHTML = tableSkeleton();
  poolBoardEl.innerHTML = tableSkeleton();

  function loadSortState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.sort) || '{}');
      if (saved && saved.key) return { key: saved.key, dir: saved.dir === 'asc' ? 'asc' : 'desc' };
    } catch (_error) {}
    return { key: 'rank', dir: 'asc' };
  }
  function saveSortState() {
    try { localStorage.setItem(STORAGE_KEYS.sort, JSON.stringify(sortState)); } catch (_error) {}
  }
  function markSortHeaders() {
    document.querySelectorAll('th[data-sort-key]').forEach((th) => {
      if (th.dataset.sortKey === sortState.key) th.dataset.sortDir = sortState.dir;
      else delete th.dataset.sortDir;
    });
  }

  document.addEventListener('click', (event) => {
    const stockCell = event.target.closest('td.stock-name-copy');
    if (stockCell) {
      const code = stockCell.dataset.code || stockCell.closest('tr')?.dataset?.code || '';
      if (code) {
        selectedCode = code;
        localStorage.setItem(STORAGE_KEYS.selectedCode, code);
        linkStockToHts(stockCell, code, event.shiftKey);
        if (lastPayload) render(lastPayload, 'stream', { forcePool:true });
      }
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    const th = event.target.closest('th[data-sort-key]');
    if (!th) return;
    const key = th.dataset.sortKey;
    const dir = sortState.key === key && sortState.dir === 'asc' ? 'desc' : 'asc';
    sortState = { key, dir };
    saveSortState();
    markSortHeaders();
    if (lastPayload) render(lastPayload, 'stream', { forcePool:true });
  });

  candidateModelSelector.addEventListener('change', () => {
    localStorage.setItem(STORAGE_KEYS.candidateModel, candidateModelSelector.value || '');
    candidateModelSelector.title = `선택된 선발기준: ${candidateModelSelector.value || '-'}`;
  });

  async function loadCandidateModels() {
    try {
      const res = await fetch(`/api/v2/candidate_models?ts=${Date.now()}`, { cache:'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const payload = await res.json();
      const models = Array.isArray(payload.models) ? payload.models : [];
      if (!models.length) throw new Error('empty model registry');
      candidateModelSelector.innerHTML = models.map(model => {
        const id = String(model.id || '').trim();
        const label = String(model.label || model.id || '').trim();
        return `<option value="${escapeHtml(id)}">${escapeHtml(label)}</option>`;
      }).join('');
      const saved = localStorage.getItem(STORAGE_KEYS.candidateModel) || payload.default_model_id || models[0].id;
      candidateModelSelector.value = saved;
      candidateModelSelector.disabled = false;
      candidateModelSelector.title = 'configs/candidate_models/_registry.json 기준';
    } catch (_error) {
      candidateModelSelector.innerHTML = '<option value="">선발기준 설정 미연결</option>';
      candidateModelSelector.disabled = true;
      candidateModelSelector.title = 'worker에 /api/v2/candidate_models 연결 후 활성화';
    }
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
  }
  function numeric(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  function sortValue(row, key) {
    if (key === 'stock_name') return String(row.stock_name || '').toLowerCase();
    const value = numeric(row[key]);
    return value === null ? null : value;
  }
  function sortedRows(rows) {
    const key = sortState.key || 'rank';
    const dir = sortState.dir === 'asc' ? 'asc' : 'desc';
    return [...rows].sort((a, b) => {
      const av = sortValue(a, key);
      const bv = sortValue(b, key);
      let result = 0;
      if (av === null && bv === null) result = (numeric(a.rank) || 999999) - (numeric(b.rank) || 999999);
      else if (av === null) result = 1;
      else if (bv === null) result = -1;
      else if (typeof av === 'number' && typeof bv === 'number') result = av - bv;
      else result = String(av).localeCompare(String(bv), 'ko-KR', { numeric:true });
      if (result === 0) result = (numeric(a.rank) || 999999) - (numeric(b.rank) || 999999);
      return dir === 'asc' ? result : -result;
    });
  }
  function byRank(rows) {
    return [...rows].sort((a, b) => (numeric(a.rank) || 999999) - (numeric(b.rank) || 999999));
  }
  function fmtNum(v, digits=0) {
    const n = Number(v);
    if (!Number.isFinite(n)) return '-';
    return n.toLocaleString('en-US', { maximumFractionDigits: digits, minimumFractionDigits: digits });
  }
  function fmtRate(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return '-';
    return n >= 1000 ? `${Math.round(n).toLocaleString('en-US')}` : n.toFixed(n >= 100 ? 0 : 1);
  }
  function fmtRatio(v) {
    const n = Number(v);
    if (!Number.isFinite(n) || n <= 0) return '-';
    return n >= 10 ? '10x+' : `${n.toFixed(n >= 3 ? 1 : 2)}x`;
  }
  function fmtRankChange(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return '-';
    if (n > 0) return `↑${Math.round(n)}`;
    if (n < 0) return `↓${Math.abs(Math.round(n))}`;
    return '0';
  }
  function clsSigned(v) {
    const n = Number(v);
    return !Number.isFinite(n) ? '' : n > 0 ? 'plus' : n < 0 ? 'minus' : 'zero';
  }
  function clsRatio(v) {
    const n = Number(v);
    if (!Number.isFinite(n) || n <= 0) return 'zero';
    return n >= 1 ? 'ratio-hot' : 'ratio-cold';
  }
  function gradeHtml(row) {
    const text = row.grade_text || row.grade || row.candidate_grade || '-';
    const lower = String(text || '').slice(0, 1).toLowerCase();
    return `<span class="grade ${['a','b','c','d','f'].includes(lower) ? lower : ''}">${escapeHtml(text)}</span>`;
  }
  function pickOhlc(row) {
    const ohlc = row.ohlc || row.realtime_ohlc || row.display_ohlc || null;
    const open = numeric(ohlc?.open ?? row.open ?? row.open_price ?? row.day_open);
    const high = numeric(ohlc?.high ?? row.high ?? row.high_price ?? row.day_high);
    const low = numeric(ohlc?.low ?? row.low ?? row.low_price ?? row.day_low);
    const close = numeric(ohlc?.close ?? ohlc?.current ?? row.close ?? row.price ?? row.trade_price);
    if ([open, high, low, close].some(value => value === null) || high <= low) return null;
    return { open, high, low, close };
  }
  function candleHtml(row) {
    const o = pickOhlc(row);
    if (!o) return '-';
    const span = Math.max(1, o.high - o.low);
    const left = value => Math.max(0, Math.min(100, (value - o.low) / span * 100));
    const bodyStart = Math.min(left(o.open), left(o.close));
    const bodyEnd = Math.max(left(o.open), left(o.close));
    const bodyWidth = Math.max(2, bodyEnd - bodyStart);
    const cls = o.close > o.open ? 'up' : o.close < o.open ? 'down' : 'flat';
    const title = `O ${fmtNum(o.open)} / H ${fmtNum(o.high)} / L ${fmtNum(o.low)} / C ${fmtNum(o.close)}`;
    return `<div class="mini-candle ${cls}" title="${title}" style="--wick-left:0%;--wick-width:100%;--body-left:${bodyStart.toFixed(2)}%;--body-width:${bodyWidth.toFixed(2)}%"><span class="wick"></span><span class="body"></span></div>`;
  }
  function rowTitle(row) {
    return [
      `코드: ${row.stock_code || '-'}`,
      `종목명 클릭: HTS 연동 / Shift+클릭: 코드만 복사`,
      `전일 거래대금: ${fmtNum(row.prev_trade_value_eok, 0)}억`,
      `대금비: ${fmtRatio(row.amount_ratio)}`,
      `row_source: ${row.row_source || '-'}`,
      `source: ${row.source_code || '-'}`
    ].join('\n');
  }
  function rowHtml(row) {
    const code = String(row.stock_code || '');
    const rate = Number(row.change_rate);
    const age = Number(row.price_age_sec);
    const rank = Number(row.rank);
    const selected = code && code === selectedCode;
    const rowClass = `${selected ? 'selected-row ' : ''}${age > 3 ? 'stale ' : ''}${Number.isFinite(rank) && rank <= 20 ? 'hot' : ''}`.trim();
    return `<tr data-code="${escapeHtml(code)}" class="${rowClass}" title="${escapeHtml(rowTitle(row))}">
      <td class="center">${escapeHtml(row.rank ?? '-')}</td>
      <td class="center ${clsSigned(row.rank_change)}">${fmtRankChange(row.rank_change)}</td>
      <td class="center">${gradeHtml(row)}</td>
      <td class="stock-name-copy" data-code="${escapeHtml(code)}" title="${escapeHtml((row.stock_name || code) + '\n클릭하면 HTS 연동\nShift+클릭하면 ' + code + ' 복사')}">${escapeHtml(row.stock_name || code)}</td>
      <td class="num">${fmtNum(row.price)}</td>
      <td class="num ${clsSigned(rate)}">${Number.isFinite(rate) ? `${rate > 0 ? '+' : ''}${rate.toFixed(2)}%` : '-'}</td>
      <td class="num" title="전일 ${fmtNum(row.prev_trade_value_eok, 0)}억">${fmtNum(row.trade_value_eok, 0)}</td>
      <td class="num ${clsRatio(row.amount_ratio)}">${fmtRatio(row.amount_ratio)}</td>
      <td class="center">${candleHtml(row)}</td>
      <td class="num">${fmtNum(row.bid_ask_ratio, 2)}</td>
      <td class="num">${fmtNum(row.execution_strength, 2)}</td>
      <td class="num">${fmtNum(row.strength_1m ?? row.one_min_strength ?? row.one_min_strength_growth_rate, 2)}</td>
      <td class="num ${clsSigned(row.program_net)}">${fmtNum(row.program_net, 0)}</td>
      <td class="num ${clsSigned(row.large_trade_net_count)}">${fmtNum(row.large_trade_net_count, 0)}</td>
    </tr>`;
  }
  function renderTable(table, rows, emptyText) {
    const tbody = table.tBodies[0];
    if (!tbody) return;
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="${columns.length}" class="center">${escapeHtml(emptyText)}</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(rowHtml).join('');
  }

  async function writeClipboardText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const input = document.createElement('input');
    input.value = text;
    input.setAttribute('readonly', 'readonly');
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.focus();
    input.select();
    document.execCommand('copy');
    input.remove();
  }
  async function linkStockToHts(cell, code, copyOnly=false) {
    const text = String(code || '').trim();
    if (!/^\d{6}$/.test(text)) return;
    try {
      const commandSeq = `${Date.now()}${++htsLinkSeq}`;
      const payload = copyOnly ? text : `SBV2|${commandSeq}|${text}`;
      await writeClipboardText(payload);
      copyStatusEl.textContent = copyOnly ? `코드 복사 ${text}` : `HTS 연동 ${text}`;
      copyStatusEl.className = 'badge copy-ok';
      window.clearTimeout(copyTimer);
      copyTimer = window.setTimeout(() => {
        copyStatusEl.textContent = '종목명 클릭=HTS연동';
        copyStatusEl.className = 'badge';
      }, 900);
    } catch (_error) {
      copyStatusEl.textContent = `HTS 요청 실패 ${text}`;
      copyStatusEl.className = 'badge bad';
    }
  }
  function payloadLagMs(payload) {
    const sentAt = Date.parse(payload && payload.ts ? payload.ts : '');
    if (!Number.isFinite(sentAt)) return null;
    return Math.max(0, Date.now() - sentAt);
  }
  function senderStats(payload) {
    return payload?.status?.collector_status?.sender_stats || {};
  }
  function computeRates(payload, sender) {
    const now = performance.now();
    const status = payload.status || {};
    const current = {
      ts: now,
      events: Number(status.event_count) || 0,
      trades: Number(status.trade_count) || 0,
      sent: Number(sender.sent_count) || 0
    };
    if (!rateSample) {
      rateSample = current;
      return { recvPerSec:null, tradePerSec:null, sentPerSec:Number(sender.sent_per_sec) || null };
    }
    const seconds = Math.max(0.001, (current.ts - rateSample.ts) / 1000);
    const rates = {
      recvPerSec: Math.max(0, (current.events - rateSample.events) / seconds),
      tradePerSec: Math.max(0, (current.trades - rateSample.trades) / seconds),
      sentPerSec: Number(sender.sent_per_sec) || Math.max(0, (current.sent - rateSample.sent) / seconds)
    };
    rateSample = current;
    return rates;
  }
  function top20Diagnostics(rows) {
    const top = byRank(rows).slice(0, 20);
    let maxLag = null;
    let stale = 0;
    top.forEach((row) => {
      const lag = numeric(row.fid20_lag_sec);
      const age = numeric(row.price_age_sec);
      if (lag !== null) maxLag = maxLag === null ? lag : Math.max(maxLag, lag);
      if (age !== null && age > 3) stale += 1;
    });
    return {
      maxLag,
      stale,
      realtimeRows: rows.filter((row) => row.row_source === 'realtime').length
    };
  }

  function render(payload, mode='stream', options={}) {
    const renderStart = performance.now();
    lastPayload = payload;
    markSortHeaders();
    const rawRows = Array.isArray(payload.rows) ? payload.rows : [];
    const rankedRows = byRank(rawRows);
    const sortedPoolRows = sortedRows(rawRows);
    const selectedRows = selectedCode ? rawRows.filter(row => String(row.stock_code || '') === selectedCode) : [];
    const focusRows = rankedRows.slice(0, 20);
    const now = performance.now();
    const shouldRenderPool = options.forcePool || now - lastPoolRenderAt >= 250;
    const lag = payloadLagMs(payload);
    const phase = payload.market_session?.phase_label || payload.status?.market_phase_label || '';
    const sender = senderStats(payload);
    const rates = computeRates(payload, sender);
    const top20 = top20Diagnostics(rawRows);
    statusEl.textContent = phase ? `연결 OK · ${phase}` : '연결 OK';
    statusEl.className = mode === 'stream' ? 'badge ok' : 'badge bad';
    countsEl.textContent = `rows ${payload.row_count || rawRows.length} · events ${payload.status?.event_count || 0} · trades ${payload.status?.trade_count || 0}`;
    latencyEl.textContent = `${mode} ${lag === null ? '-' : lag.toFixed(0)} ms · sort ${sortState.key}/${sortState.dir}`;
    throughputEl.textContent = `recv/s ${rates.recvPerSec === null ? '-' : fmtRate(rates.recvPerSec)} · trade/s ${rates.tradePerSec === null ? '-' : fmtRate(rates.tradePerSec)}`;
    collectorMetricsEl.textContent = `collector_q ${sender.pending_total_count ?? '-'} · sent/s ${rates.sentPerSec === null ? '-' : fmtRate(rates.sentPerSec)} · cxl ${sender.coalesced_trade_overwrite_count ?? '-'}`;
    collectorMetricsEl.className = Number(sender.pending_total_count) > 100 ? 'badge warn' : 'badge';
    workerMetricsEl.textContent = `worker_q ${payload.status?.event_log_queue_size ?? '-'} · drop ${payload.status?.dropped_trade_count ?? 0} · logdrop ${payload.status?.event_log_dropped_count ?? 0}`;
    workerMetricsEl.className = Number(payload.status?.event_log_queue_size) > 10000 ? 'badge warn' : 'badge';
    lagMetricsEl.textContent = `top20 lag ${top20.maxLag === null ? '-' : top20.maxLag.toFixed(1) + 's'} · stale ${top20.stale} · rt ${top20.realtimeRows}`;
    lagMetricsEl.className = (top20.maxLag !== null && top20.maxLag > 3) || top20.stale > 0 ? 'badge warn' : 'badge';

    renderTable(selectedBoardEl, selectedRows, '종목명을 클릭하면 S1 선택 종목으로 고정됩니다.');
    selectedRowCountEl.textContent = `${selectedRows.length}종목`;
    renderTable(focusBoardEl, focusRows, '집중 후보 수신 대기 중입니다.');
    focusRowCountEl.textContent = `${focusRows.length}종목`;
    if (shouldRenderPool) {
      renderTable(poolBoardEl, sortedPoolRows, 'Top300 Pool 수신 대기 중입니다.');
      poolRowCountEl.textContent = `${sortedPoolRows.length}종목`;
      lastPoolRenderAt = now;
    }
    updateTopbarHeight();
    const renderMs = performance.now() - renderStart;
    renderMetricsEl.textContent = `render ${renderMs.toFixed(1)} ms`;
    renderMetricsEl.className = renderMs > 70 ? 'badge warn' : 'badge';
  }

  async function fallbackPoll() {
    try {
      const res = await fetch(`/api/v2/snapshot?limit=300&ts=${Date.now()}`, { cache:'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const payload = await res.json();
      render(payload, 'poll', { forcePool:true });
    } catch (e) {
      statusEl.textContent = `연결 실패: ${e.message}`;
      statusEl.className = 'badge bad';
    }
  }
  function startFallback() {
    if (fallbackTimer) return;
    fallbackTimer = setInterval(() => {
      if (!lastStreamAt || performance.now() - lastStreamAt > 4000) fallbackPoll();
    }, 1000);
  }
  function connectStream() {
    if (!window.EventSource) {
      startFallback();
      return;
    }
    stream = new EventSource(`/api/v2/stream?limit=300&interval_ms=100&ts=${Date.now()}`);
    stream.addEventListener('snapshot', (event) => {
      try {
        lastStreamAt = performance.now();
        render(JSON.parse(event.data), 'stream');
      } catch (error) {
        console.warn(error);
      }
    });
    stream.onerror = () => {
      statusEl.textContent = 'stream 재연결 중';
      statusEl.className = 'badge bad';
      startFallback();
    };
  }
  setInterval(() => {
    clockEl.textContent = new Date().toLocaleTimeString('ko-KR', { hour12:false });
    if (lastPayload && (!lastStreamAt || performance.now() - lastStreamAt > 1000)) render(lastPayload, 'stream');
  }, 500);
  clockEl.textContent = new Date().toLocaleTimeString('ko-KR', { hour12:false });
  loadCandidateModels();
  markSortHeaders();
  updateTopbarHeight();
  connectStream();
</script>
</body>
</html>
